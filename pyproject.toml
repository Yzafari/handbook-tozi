[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridhand-backend"
version = "0.1.0"
description = "GridHand Backend Foundation for Electricity Distribution Engineers in Iran"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.28.0",
    "sqlalchemy==2.0.28",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "redis==5.0.3",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    "python-multipart==0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "httpx==0.27.0",
    "pytest-asyncio==0.23.5",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
