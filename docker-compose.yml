services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://app:app_password@postgres:5432/appdb?schema=public
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      JWT_ACCESS_SECRET: dev_only_change_me_jwt_access_secret_0123456789abcdef
      ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      COOKIE_SECURE: "false"
      ZARINPAL_MERCHANT_ID: 00000000-0000-0000-0000-000000000000
      ZARINPAL_SANDBOX: "true"
      ZARINPAL_CALLBACK_URL: http://localhost:4000/api/payment/verify
      PAYMENT_WEBHOOK_SECRET: dev_only_webhook_secret_change_me
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      MAIL_FROM: "App <no-reply@localhost>"
      SEED_SUPER_ADMIN_EMAIL: admin@example.com
      SEED_SUPER_ADMIN_PASSWORD: ChangeMe123!
      UPLOAD_DIR: uploads
    volumes:
      - uploads:/app/uploads

  frontend:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      # frontend's vite.config should read this for the /api proxy target
      VITE_PROXY_TARGET: http://backend:4000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  uploads:
  frontend_node_modules: