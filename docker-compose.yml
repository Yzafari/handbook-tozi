version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend:
    build: ./backend
    container_name: backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://user:password@postgres:5432/mydatabase
      JWT_ACCESS_SECRET: your_jwt_access_secret
      ENCRYPTION_KEY: your_encryption_key
      ZARINPAL_MERCHANT_ID: your_zarinpal_merchant_id
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USER: your_smtp_user
      SMTP_PASSWORD: your_smtp_password
      SMTP_FROM: your_smtp_from_email
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://backend:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://frontend:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
