name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Create .env
        # Expo inlines EXPO_PUBLIC_* at build time; a release build without a
        # public API URL is not shippable, so the job fails early.
        run: |
          if [ -z "${{ secrets.EXPO_PUBLIC_API_URL }}" ]; then
            echo "::error::Repository secret EXPO_PUBLIC_API_URL is not set."
            exit 1
          fi
          printf 'EXPO_PUBLIC_API_URL=%s\n' "${{ secrets.EXPO_PUBLIC_API_URL }}" > .env

      - uses: actions/setup-android@v3

      - name: Prebuild Android project
        env:
          CI: 'true'
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: List generated APKs
        run: find android/app/build/outputs -name '*.apk' -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: handbook-distribution-apk-${{ github.run_number }}
          # Gradle names the file app-release(-unsigned).apk depending on whether
          # a signing config is present, so upload whatever was produced.
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
