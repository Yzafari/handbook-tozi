name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    # Pinned on purpose: ubuntu-latest moved to 26.04, where the SDK setup step
    # below failed before reaching the build.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # v4 ships current cmdline-tools; v3's pinned 12.0 cannot read the
      # repository XML served today and dies in this step.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # setup-android@v4 already accepts the licenses; this keeps the license
      # files in place for Gradle even if that is skipped, and never fails the
      # job when ANDROID_SDK_ROOT happens to be unset.
      - name: Accept Android SDK licenses
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          mkdir -p "$sdk_root/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$sdk_root/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$sdk_root/licenses/android-sdk-preview-license"
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$sdk_root/licenses/intel-android-extra-license"
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$sdk_root/licenses/google-gdk-license"
          echo -e "\ne9acab5b5fbb560a72797e954da520dc8bd8b551" > "$sdk_root/licenses/android-googletv-license"
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "$sdk_root/licenses/android-google-xr-license"
          echo -e "\n494517e45ac67e6a790707ba1ecb87d8180e0455" > "$sdk_root/licenses/microxr-sysimage-license"
          echo -e "\n3304a8b4d451a0f15d8a352d1c8dbc85cf6f89bd" > "$sdk_root/licenses/android-sdk-arm-dbt-license"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Create .env
        # Expo inlines EXPO_PUBLIC_* at bundle time. Without the secret the
        # bundle still compiles (offline screens keep working) and API calls
        # fail at runtime with a clear message, so keep building the artifact
        # and surface the misconfiguration as a warning instead of a failure.
        run: |
          if [ -z "${{ secrets.EXPO_PUBLIC_API_URL }}" ]; then
            echo "::warning::Repository secret EXPO_PUBLIC_API_URL is not set; the APK is built without an API endpoint."
            exit 0
          fi
          case "${{ secrets.EXPO_PUBLIC_API_URL }}" in
            *example.com*) echo "::warning::EXPO_PUBLIC_API_URL still points at the example.com placeholder." ;;
          esac
          printf 'EXPO_PUBLIC_API_URL=%s\n' "${{ secrets.EXPO_PUBLIC_API_URL }}" > .env

      # The value is passed through the environment, not only .env: `expo
      # prebuild` uses it to decide whether cleartext HTTP is allowed and
      # `expo export:embed` (run by Gradle) inlines it into the release bundle.
      - name: Prebuild Android project
        env:
          CI: 'true'
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: List generated APKs
        run: find android/app/build/outputs -name '*.apk' -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: handbook-distribution-apk-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
